name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up consecutive runs
          
      - name: Install Linting Dependencies
        run: |
          echo "Installing flake8 for code quality checks..."
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Run Flake8 Linter
        run: |
          echo "Executing linting rules. Failing fast on syntax errors or undefined names..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Linting passed successfully!"

  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Validate Dependencies File
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "::error::requirements.txt not found!"
            exit 1
          fi
          
      - name: Install Application Dependencies
        run: |
          echo "Installing core dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Pytest Suite
        run: |
          echo "Running unit tests with coverage reporting..."
          pytest test_app.py --cov=app || { echo "::error::Pytest suite failed!"; exit 1; }

  deploy:
    name: Production Deployment
    needs: [lint, test] # Wait for both lint and test jobs to succeed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Cloud Environment
        run: |
          echo "🚀 Initiating deployment to the production server..."
          # Insert actual deployment webhook or CLI commands here
          # Example: curl -sSf -X POST https://api.render.com/deploy/srv-xxxxx?key=yyyyy || { echo "::error::Deployment failed"; exit 1; }
          echo "✅ Deployment sequence completed successfully."
